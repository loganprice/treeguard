name: Feature Request
description: Propose a new feature, CLI enhancement, or architecture improvement for TreeGuard
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make TreeGuard better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen and how it should work.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary Area
      description: Which part of TreeGuard does this feature impact?
      options:
        - CLI / Developer Experience
        - Supported Languages / Parsers
        - Rego Builtins & Functions
        - Rule Engine / Evaluation Performance
        - Reporting / Export Formats (SARIF, JSON, HTML, etc.)
        - Package Management & Distribution (treeguard pack)
        - Editor Integrations (VSCode, LSP)
        - Documentation / Examples
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
