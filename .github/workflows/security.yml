name: Security SAST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  sast-scan:
    name: TreeGuard Self-Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build TreeGuard
        run: |
          CGO_ENABLED=1 go build -v -o treeguard ./cmd/treeguard

      - name: Run TreeGuard Security Scan
        run: |
          ./treeguard scan --rules rules/ --format sarif -o treeguard-sast.sarif cmd/ internal/ || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: treeguard-sast.sarif
          category: treeguard-sast
